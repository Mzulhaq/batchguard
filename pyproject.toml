[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "batchguard"
version = "0.1.0"
description = "Contract-checked CSV ingestion with quarantine, quality gates, and transactional SQL lineage."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.urls]
Repository = "https://github.com/Mzulhaq/batchguard"

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-cov>=6,<8", "ruff>=0.9,<1", "build>=1.2,<2"]

[project.scripts]
batchguard = "batchguard.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
